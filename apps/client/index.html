<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos TD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #replay-controls {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      color: #eef3f0;
      background: rgba(11, 15, 18, 0.92);
      border: 1px solid #52635d;
      font: 12px Arial, sans-serif;
    }
    #training-monitor {
      position: fixed;
      top: 64px;
      left: 12px;
      z-index: 10;
      width: 285px;
      padding: 10px;
      color: #eef3f0;
      background: rgba(11, 15, 18, 0.92);
      border: 1px solid #52635d;
      font: 12px/1.45 Arial, sans-serif;
    }
    #training-monitor strong { color: #f0cf83; }
    #training-monitor .training-row { display: flex; justify-content: space-between; gap: 12px; }
    #human-guidance-progress {
      position: fixed;
      top: 220px;
      left: 12px;
      z-index: 10;
      width: 285px;
      padding: 10px;
      color: #eef3f0;
      background: rgba(11, 15, 18, 0.92);
      border: 1px solid #52635d;
      font: 12px/1.45 Arial, sans-serif;
    }
    #human-guidance-progress strong { color: #f0cf83; }
    #human-guidance-bar { width: 100%; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="replay-controls">
    <label>Training replay <input id="replay-file" type="file" accept="application/json,.json"></label>
    <button id="replay-pause" type="button">Pause</button>
    <button id="training-live" type="button">Live training</button>
    <button id="human-guided" type="button">Start human-guided evolution</button>
    <select id="replay-speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select>
  </div>
  <aside id="training-monitor" aria-live="polite">
    <strong>TRAINING MONITOR</strong>
    <div id="training-status">Waiting for a training run…</div>
  </aside>
  <aside id="human-guidance-progress" hidden aria-live="polite">
    <strong>HUMAN-GUIDED TRAINING</strong>
    <progress id="human-guidance-bar" max="8" value="0"></progress>
    <div id="human-guidance-status">Training is preparing…</div>
  </aside>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
